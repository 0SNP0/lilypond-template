name: Publish ScoreKit website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Assemble site and independent catalog
        run: python3 scorekit/viewer/build_site.py --output _site
      - name: Mirror release assets into this website
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scorekit/viewer/mirror_releases.py --output _site --max-releases 2 --max-site-mib 650
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
