name: Build orchestra
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_export:
        description: "Build MP3, MIDI and synchronized SVG/JSON viewer too"
        type: boolean
        required: false
        default: false
concurrency:
  group: orchestra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install official latest stable LilyPond
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Authenticate GitHub API requests to avoid unauthenticated rate limits.
          version="$(gh api repos/lilypond/lilypond/releases/latest --jq '.tag_name' | sed 's/^v//')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid LilyPond release version: $version"; exit 1; }
          url="https://gitlab.com/lilypond/lilypond/-/releases/v${version}/downloads/lilypond-${version}-linux-x86_64.tar.gz"
          curl --retry 3 -fLsS "$url" -o "$RUNNER_TEMP/lilypond.tar.gz"
          tar -xzf "$RUNNER_TEMP/lilypond.tar.gz" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/lilypond-${version}/bin/lilypond"
          echo "$RUNNER_TEMP/lilypond-${version}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lilypond-${version}/bin/lilypond" --version | head -n 1
      - name: Install PDF validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pypdf fonts-texgyre
      - name: Install audio dependencies
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_export) }}
        run: sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg
      - name: Download MuseScore MS Basic SoundFont
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_export) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soundfonts
          curl --retry 3 -fLsS --output soundfonts/MS_Basic.sf3 \
            "https://raw.githubusercontent.com/musescore/MuseScore/0e44d8e1dd7e0cad1fac85915330c5225bd7882e/share/sound/MS%20Basic.sf3"
          test "$(stat -c %s soundfonts/MS_Basic.sf3)" -gt 50000000
      - name: Validate printed/playback repeat structure
        run: python3 scripts/check_music_structure.py
      - name: Build PDF and package (full export only on request or tag)
        env:
          SOURCE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SOUNDFONT: soundfonts/MS_Basic.sf3
          FULL_EXPORT: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_export)) && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FULL_EXPORT" == "1" ]]; then
            python3 scripts/build.py build --audio
            python3 scripts/build.py package --full
          else
            python3 scripts/build.py build
            python3 scripts/build.py package
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestra-${{ github.sha }}
          path: |
            dist/pdf/*.pdf
            dist/audio/*.mp3
            dist/audio/*.midi
            dist/audio/stems/*.mp3
            dist/packages/*.zip
            dist/print-manifest.json
            dist/viewer/index.html
            dist/viewer/manifest.json
            dist/viewer/timeline.json
            dist/viewer/**/*.svg
            dist/viewer/*.json
          if-no-files-found: warn
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orchestra-${{ github.sha }}
          path: dist/
      - name: Publish PDF files and archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; upload or replace assets"
            gh release upload "$TAG" dist/pdf/*.pdf dist/packages/*.zip --clobber
          else
            echo "Create release $TAG with compiled assets"
            gh release create "$TAG" dist/pdf/*.pdf dist/packages/*.zip --verify-tag --generate-notes --title "$TAG"
          fi
