name: Build Snowstorm Waltz PDFs
on:
  push:
    branches: [score/sviridov-snowstorm-waltz]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install latest stable LilyPond
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl --retry 3 -fsSL https://api.github.com/repos/lilypond/lilypond/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"].removeprefix("v"))')" || version="2.26.0"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl --retry 3 -fsSL "https://gitlab.com/lilypond/lilypond/-/releases/v${version}/downloads/lilypond-${version}-linux-x86_64.tar.gz" -o "$RUNNER_TEMP/lilypond.tar.gz"
          tar -xzf "$RUNNER_TEMP/lilypond.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lilypond-${version}/bin" >> "$GITHUB_PATH"
      - name: Install audio rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fluidsynth fluid-soundfont-gm ffmpeg fonts-texgyre
      - name: Generate PDFs and preview audio
        env:
          SOUNDFONT: /usr/share/sounds/sf2/FluidR3_GM.sf2
        run: python3 scripts/build_waltz.py
      - name: Upload results even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sviridov-waltz-${{ github.sha }}
          path: |
            dist/pdf/*.pdf
            dist/audio/*.midi
            dist/audio/*.mp3
            dist/packages/*.zip
            dist/build-report.json
          if-no-files-found: warn
          retention-days: 14
