name: ScoreKit publish release
description: Publish score PDFs and archives for a Git release tag
inputs:
  tag:
    description: Exact tag to publish
    required: true
runs:
  using: composite
  steps:
      - uses: actions/download-artifact@v4
        with:
          name: score-pdf-${{ github.sha }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: score-media-${{ github.sha }}
          path: .
      - name: Prepare standalone orchestra audio file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          shopt -s nullglob
          mixes=(dist/audio/*.mp3)
          test "${#mixes[@]}" -eq 1
          cp "${mixes[0]}" "dist/release/89-$(basename "${mixes[0]}")"
      - name: Publish PDFs and three release bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; upload or replace assets"
            gh release upload "$TAG" dist/pdf/*.pdf dist/packages/*-pdf-*.zip dist/packages/*-audio-*.zip dist/packages/*-viewer-*.zip dist/release/89-*.mp3 --clobber
          else
            echo "Create release $TAG with compiled assets"
            gh release create "$TAG" dist/pdf/*.pdf dist/packages/*-pdf-*.zip dist/packages/*-audio-*.zip dist/packages/*-viewer-*.zip dist/release/89-*.mp3 --verify-tag --generate-notes --title "$TAG"
          fi
