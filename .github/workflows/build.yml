name: Build orchestra
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install engraving and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond fluidsynth fluid-soundfont-gm ffmpeg python3-pypdf
      - name: Check README matches score metadata
        run: python3 scripts/build.py readme-check
      - name: Build all PDFs and MP3 tracks
        env:
          SOURCE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SOUNDFONT: /usr/share/sounds/sf2/FluidR3_GM.sf2
        run: |
          python3 scripts/build.py build --audio
          python3 scripts/build.py package
      - uses: actions/upload-artifact@v4
        with:
          name: orchestra-${{ github.sha }}
          path: |
            dist/pdf/*.pdf
            dist/audio/*.mp3
            dist/audio/*.midi
            dist/audio/stems/*.mp3
            dist/packages/*.zip
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orchestra-${{ github.sha }}
          path: dist/
      - name: Publish PDF files and archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/pdf/*.pdf dist/packages/scores-pdf.zip dist/packages/audio.zip --verify-tag --generate-notes --title "$TAG"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true
      - name: Update latest release link on README
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build.py readme-release "$TAG"
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: link latest score release $TAG"
            git push origin HEAD:main
          fi
