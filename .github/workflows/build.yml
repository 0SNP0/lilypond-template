name: Build orchestra
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
concurrency:
  group: orchestra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
permissions:
  contents: read
jobs:
  pdf:
    name: PDF score and parts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: ScoreKit print
        uses: ./scorekit/actions/build
        with:
          source_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
  media:
    name: MIDI, audio, viewer and packages
    needs: pdf
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: ScoreKit media
        uses: ./scorekit/actions/media
        with:
          source_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - name: Publish musician-facing GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./scorekit/actions/release
        with:
          tag: ${{ github.ref_name }}
