name: ScoreKit audio and viewer stage
description: Reuse printable PDFs and produce MIDI MP3 interactive viewer and media bundles
inputs:
  source_tag:
    description: Git release tag when building a release
    required: false
    default: ''
runs:
  using: composite
  steps:
      - name: Download completed PDF print stage
        uses: actions/download-artifact@v7
        with:
          name: score-pdf-${{ github.sha }}
          path: .
      - name: Install pinned LilyPond from ScoreKit
        uses: ./scorekit/actions/install-lilypond
      - name: Install PDF validation dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pypdf fonts-texgyre
      - name: Install audio dependencies
        shell: bash
        run: sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg
      - name: Download MuseScore MS Basic SoundFont
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soundfonts
          curl --retry 3 -fLsS --output soundfonts/MS_Basic.sf3 \
            "https://raw.githubusercontent.com/musescore/MuseScore/0e44d8e1dd7e0cad1fac85915330c5225bd7882e/share/sound/MS%20Basic.sf3"
          test "$(stat -c %s soundfonts/MS_Basic.sf3)" -gt 50000000
      - name: Build MIDI and audio without reprinting PDFs
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOUNDFONT: soundfonts/MS_Basic.sf3
        run: |
          set -euo pipefail
          python3 scorekit/scripts/build.py build --audio --reuse-pdf
          python3 scorekit/scripts/build.py package --full
      - name: Upload synchronized media and viewer bundle
        uses: actions/upload-artifact@v6
        with:
          name: score-media-${{ github.sha }}
          path: |
            dist/audio/*.mp3
            dist/audio/stems/*.mp3
            dist/packages/*-audio-*.zip
            dist/packages/*-viewer-*.zip
            dist/viewer/index.html
            dist/viewer/manifest.json
            dist/viewer/timeline.json
            dist/viewer/**/*.svg
            dist/viewer/*.json
          if-no-files-found: error
          retention-days: 14
