name: Orchestra · PDFs and audio

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestra:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LilyPond / FluidSynth / SoundFont / FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lilypond fluidsynth fluid-soundfont-gm ffmpeg python3-pypdf
          lilypond --version | head -n 1
          fluidsynth --version
          ffmpeg -version | head -n 1

      - name: Run source tests
        run: python3 -m unittest discover -s tests -v

      - name: Build PDF, 21 MP3 stems and orchestra mix
        env:
          SOURCE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SOUNDFONT: /usr/share/sounds/sf2/FluidR3_GM.sf2
        run: |
          python3 scripts/build.py build --audio
          python3 scripts/build.py package

      - name: Upload artifacts for every successful run
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-${{ github.sha }}
          path: |
            dist/pdf/*.pdf
            dist/audio/*.mp3
            dist/audio/*.midi
            dist/audio/stems/*.mp3
            dist/packages/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: orchestra
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download compiled materials
        uses: actions/download-artifact@v4
        with:
          name: orchestra-${{ github.sha }}
          path: dist/

      - name: Publish individual PDFs and two archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test -f dist/packages/scores-pdf.zip
          test -f dist/packages/audio.zip
          gh release create "$TAG" \
            dist/pdf/*.pdf \
            dist/packages/scores-pdf.zip \
            dist/packages/audio.zip \
            --verify-tag --generate-notes --title "$TAG"
