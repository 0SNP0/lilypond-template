name: ScoreKit PDF print stage
description: Build printable parts first and publish PDF archive immediately
inputs:
  source_tag:
    description: Git release tag when building a release
    required: false
    default: ''
runs:
  using: composite
  steps:
      - name: Install pinned LilyPond from ScoreKit
        uses: ./scorekit/actions/install-lilypond
      - name: Compile native combined-staff preview fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/combined-staff-preview
          lilypond -dno-point-and-click -o build/combined-staff-preview/native-preview scorekit/tests/fixtures/combined-staff/native-preview.ly
          test -s build/combined-staff-preview/native-preview.pdf
      - name: Install PDF validation dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pypdf fonts-texgyre
      - name: Validate viewer JavaScript syntax and shared tests
        shell: bash
        run: |
          node --check scorekit/viewer/portal/app.js
          node --check scorekit/viewer/portal/readme-links.js
          node scorekit/tests/test_readme_links.cjs
          node --check scorekit/viewer/portal/mixer-selection.js
          node scorekit/tests/test_mixer_selection.cjs
          node --check scorekit/viewer/portal/page-zoom.js
          node scorekit/tests/test_page_zoom.cjs
          node --check scorekit/viewer/portal/audio-buffer.js
          node scorekit/tests/test_audio_buffer.cjs
          node --check scorekit/viewer/portal/measure-spans.js
          node scorekit/tests/test_measure_spans.cjs
          python3 -m unittest discover -s scorekit/tests -p 'test_*.py'
      - name: Validate printed/playback repeat structure
        shell: bash
        run: python3 scorekit/scripts/check_music_structure.py
      - name: Check print and music hashes ignore the Git revision
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scorekit/scripts").resolve()))
          from notation_hash import print_fingerprint, music_fingerprint
          source = Path("score.ly").resolve()
          checks = []
          for version in ("v0.0.1-1-g00000000", "v9.9.9-999-gffffffff"):
              os.environ["SCORE_BUILD_REVISION"] = version
              checks.append((print_fingerprint(source), music_fingerprint(source)))
          assert checks[0] == checks[1], "Hashes depend on the Git version"
          print("print_hash and music_hash are independent of SCORE_BUILD_REVISION")
          PY
      - name: Build and package printable PDFs
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          python3 scorekit/scripts/build.py build
          python3 scorekit/scripts/build.py package
      - name: Upload early PDF bundle
        uses: actions/upload-artifact@v4
        with:
          name: score-pdf-${{ github.sha }}
          path: |
            dist/pdf/*.pdf
            dist/packages/*-pdf-*.zip
            dist/print-manifest.json
            build/build-info.json
            build/score-indent.json
          if-no-files-found: error
          retention-days: 14
