name: Import Snowstorm Waltz MusicXML
on:
  push:
    branches:
      - score/sviridov-snowstorm-waltz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import_score:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack snapshot of user-supplied MusicXML conversion
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, shutil, zipfile
          root = pathlib.Path('.')
          marker = root / 'source' / 'IMPORTED'
          if marker.exists():
              print('Already imported; do not overwrite editor changes.')
          else:
              source = root / 'source' / 'notation.bundle.b85'
              if not source.is_file():
                  raise SystemExit('Missing compressed conversion snapshot')
              data = base64.b85decode(source.read_text().strip())
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  paths = archive.namelist()
                  if len(paths) < 45 or any(name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts for name in paths):
                      raise SystemExit('Unexpected source archive contents')
                  shutil.rmtree(root / 'music')
                  shutil.rmtree(root / 'parts')
                  for info in archive.infolist():
                      dest = root / info.filename
                      if info.is_dir():
                          dest.mkdir(parents=True, exist_ok=True)
                      else:
                          dest.parent.mkdir(parents=True, exist_ok=True)
                          dest.write_bytes(archive.read(info))
              # Normalize MusicXML multi-voice syntax to LilyPond voice separator.
              for score in (root / 'music').glob('*.ily'):
                  data = score.read_text()
                  data = data.replace(' } ' + chr(92) + ' { ' + chr(92) + 'voiceTwo ', ' } ' + chr(92)*2 + ' { ' + chr(92) + 'voiceTwo ')
                  score.write_text(data)
              marker.write_text('268 measures x 21 original MusicXML part staves; initial converter snapshot.\n')
              print('Extracted', len(paths), 'editable LilyPond files')
          PY
      - name: Commit imported score to the work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all music parts score.ly concert-score.ly metadata.ily orchestra.ily import-report.json source/IMPORTED
          if ! git diff --cached --quiet; then
            git commit -m "import: expand Sviridov Waltz into editable LilyPond sources"
            git push origin HEAD:score/sviridov-snowstorm-waltz
          fi
      - name: Install official latest stable LilyPond
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl --retry 3 -fsSL https://api.github.com/repos/lilypond/lilypond/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].removeprefix("v"))')" || version="2.26.0"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid LilyPond release version: $version"; exit 1; }
          url="https://gitlab.com/lilypond/lilypond/-/releases/v${version}/downloads/lilypond-${version}-linux-x86_64.tar.gz"
          curl --retry 3 -fLsS "$url" -o "$RUNNER_TEMP/lilypond.tar.gz"
          tar -xzf "$RUNNER_TEMP/lilypond.tar.gz" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/lilypond-${version}/bin/lilypond"
          echo "$RUNNER_TEMP/lilypond-${version}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lilypond-${version}/bin/lilypond" --version | head -n 1
      - name: Validate first part and full score parse
        run: |
          mkdir -p /tmp/waltz-check
          lilypond -dno-print-pages -dno-point-and-click -o /tmp/waltz-check/piccolo parts/piccolo.ly
          lilypond -dno-print-pages -dno-point-and-click -o /tmp/waltz-check/score score.ly
