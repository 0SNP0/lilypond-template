name: Build orchestra
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      viewer:
        description: "Also render optional SVG interactive score viewer"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install official latest stable LilyPond
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl --retry 3 -fsSL https://api.github.com/repos/lilypond/lilypond/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].removeprefix("v"))')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid LilyPond release version: $version"; exit 1; }
          url="https://gitlab.com/lilypond/lilypond/-/releases/v${version}/downloads/lilypond-${version}-linux-x86_64.tar.gz"
          curl --retry 3 -fLsS "$url" -o "$RUNNER_TEMP/lilypond.tar.gz"
          tar -xzf "$RUNNER_TEMP/lilypond.tar.gz" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/lilypond-${version}/bin/lilypond"
          echo "$RUNNER_TEMP/lilypond-${version}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lilypond-${version}/bin/lilypond" --version | head -n 1
      - name: Install audio and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg python3-pypdf fonts-texgyre
      - name: Download GeneralUser GS orchestra SoundFont
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soundfonts
          curl --retry 3 -fLsS --output soundfonts/GeneralUser-GS.sf2 \
            https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/97049183643d5fc5a9322a69c5b09efb667c6c3a/GeneralUser-GS.sf2
          test "$(stat -c %s soundfonts/GeneralUser-GS.sf2)" -gt 30000000
          echo "GeneralUser GS SoundFont downloaded (revision 9704918)"
      - name: Build all PDF parts and MP3 tracks
        env:
          SOURCE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SOUNDFONT: soundfonts/GeneralUser-GS.sf2
          LILYPOND_EXPORT_VIEWER: ${{ inputs.viewer && '1' || '0' }}
        run: |
          python3 scripts/build.py build --audio
          python3 scripts/build.py package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestra-${{ github.sha }}
          path: |
            dist/pdf/*.pdf
            dist/audio/*.mp3
            dist/audio/*.midi
            dist/audio/stems/*.mp3
            dist/packages/*.zip
            dist/print-manifest.json
            dist/timeline.csv
            dist/viewer/**/*.svg
            dist/viewer/*.json
          if-no-files-found: warn
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orchestra-${{ github.sha }}
          path: dist/
      - name: Publish PDF files and archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; upload or replace assets"
            gh release upload "$TAG" dist/pdf/*.pdf dist/packages/*.zip dist/timeline.csv --clobber
          else
            echo "Create release $TAG with compiled assets"
            gh release create "$TAG" dist/pdf/*.pdf dist/packages/*.zip dist/timeline.csv --verify-tag --generate-notes --title "$TAG"
          fi
