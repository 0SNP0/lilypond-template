name: Publish this score's latest release
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml", "site/**", "scorekit/viewer/**"]
  workflow_dispatch:
  repository_dispatch:
    types: [scorekit-release]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: python3 scorekit/viewer/build_site.py --output _site
      - name: Publish only latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scorekit/viewer/publish_latest.py --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
